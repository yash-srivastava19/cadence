# pyproject.toml
[project]
name = "cadence"
version = "0.1.0"
description = "LLM-based program evolution framework, similar to AlphaEvolve"
# Upper bound because pydantic-core has no wheel for 3.14 and PyO3 will not
# build against it, so a 3.14 venv fails to sync rather than failing loudly.
requires-python = ">=3.11.4,<3.14"

dependencies = [
  "pydantic>=2.5.0",
  "python-statemachine>=3.2.1",
  "blinker>=1.9.0",
  "whatthepatch>=1.0.7",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "typer>=0.12",
  "redis>=8.1.0",
]

[project.scripts]
cadence = "cadence.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence"]



[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "llm: marks tests as requiring LLM API access",
]

# Logging configuration for tests
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Coverage configuration
[tool.coverage.run]
source = ["cadence"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
files = ["cadence"]
python_version = "3.11"

# whatthepatch ships no stubs and has no types-* package. Silencing it by name
# rather than globally, so the next untyped dependency is a decision someone
# makes on purpose.
[[tool.mypy.overrides]]
module = ["whatthepatch.*"]
ignore_missing_imports = true

# The three planes, and the vocabulary underneath them. A layer may import
# what is below it and never what is above: this is the rule the package
# layout has always claimed, and until now nothing checked it.
[tool.importlinter]
root_package = "cadence"

[[tool.importlinter.contracts]]
name = "The planes are layered"
type = "layers"
layers = [
  "cadence.commands",
  # The web plane is an entry point like commands, but commands owns the
  # `cadence dashboard` verb that starts it, so it sits between the two.
  "cadence.web",
  "cadence.delivery",
  "cadence.control",
  "cadence.execution",
  "cadence.parsing",
  "cadence.observe",
  "cadence.core",
  "cadence.lifecycle",
  "cadence.errors",
]

# Ruff is the only formatter; see .pre-commit-config.yaml
[tool.ruff]
line-length = 88
target-version = "py311"
# Ruff formats python blocks inside markdown, and the docs pages that still
# describe the replaced loop are waiting to be rewritten rather than
# reformatted. Everything else in the repo is linted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order, so isort has nothing left to do
    "B",        # bugbear: the real bugs in this list
    "C4",       # comprehensions
    "SIM",      # simplifications
    "UP",       # syntax this Python version made obsolete
    "PIE",      # small misfeatures
    "PT",       # pytest style
    "RUF",      # ruff's own
]
ignore = [
    # typer's documented idiom is a call in the default: Argument(), Option().
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# One long string of HTML, CSS and JavaScript. Python's line limit is about
# Python being readable; wrapping a stylesheet to fit it makes the stylesheet
# worse, and the en dashes are the character the page is supposed to show.
"cadence/web/page.py" = ["E501", "RUF001"]

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["cadence"]
skip_glob = ["*/migrations/*"]

[dependency-groups]
# mkdocs builds the site; nothing in cadence imports it. A group rather than
# an extra so `uv sync --all-groups` still installs it for `mkdocs serve`.
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
]

# The one environment: groups, not extras. CI runs `uv sync --all-groups`,
# make install runs the same through uv, and there is no second list to
# drift out of step.
dev = [
    "import-linter>=2.13",
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]
