# pyproject.toml
[project]
name = "cadence"
version = "0.1.0"
description = "LLM-based program evolution framework, similar to AlphaEvolve"
requires-python = ">=3.11.4"

dependencies = [
  "matplotlib",
  "python-dotenv",
  "google-genai",
  "scikit-learn>=1.7.0",
  "flask>=3.1.1",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.15",
  "memory-profiler>=0.61.0",
  "pydantic>=2.5.0",
  "rich>=14.0.0",
  "hydra-core>=1.3.2",
  "tqdm>=4.67.1",
  "python-statemachine>=3.2.1",
  "blinker>=1.9.0",
  "whatthepatch>=1.0.7",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pytest-mock>=3.10.0",
  "pytest-xdist>=3.3.0",
]

dev = [
  "isort>=6.0.1",
  "flake8>=7.3.0",
  "mypy>=1.5.0",
  "pre-commit>=4.2.0",
]

docs = [
  "sphinx>=7.1.0",
  "sphinx-rtd-theme>=2.0.0",
  "myst-parser>=2.0.0",
  "sphinx-autodoc-typehints>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence", "src"]



[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "llm: marks tests as requiring LLM API access",
]

# Logging configuration for tests
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Coverage configuration
[tool.coverage.run]
source = ["cadence", "src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# PyRight configuration
[tool.pyright]
include = ["cadence", "src", "tests"]
exclude = ["**/__pycache__"]
defineConstant = { DEBUG = true }
stubPath = "typings"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"
pythonPlatform = "All"
executionEnvironments = [
  { root = "src", pythonVersion = "3.11" },
  { root = "tests", pythonVersion = "3.11" }
]

# Ruff is the only formatter; see .pre-commit-config.yaml
[tool.ruff]
line-length = 88
target-version = "py311"

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["cadence", "src"]
skip_glob = ["*/migrations/*"]

[[tool.ty.overrides]]
exclude = [
    "*.ipynb",
    "tests/**",
]
