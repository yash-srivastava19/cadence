# pyproject.toml
[project]
name = "cadence"
version = "0.1.0"
description = "LLM-based program evolution framework, similar to AlphaEvolve"
# Upper bound because pydantic-core has no wheel for 3.14 and PyO3 will not
# build against it, so a 3.14 venv fails to sync rather than failing loudly.
requires-python = ">=3.11.4,<3.14"

dependencies = [
  "matplotlib",
  "python-dotenv",
  "google-genai", # only src/llm.py needs this; goes when src/ does
  "scikit-learn>=1.7.0",
  "flask>=3.1.1",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.15",
  "memory-profiler>=0.61.0",
  "pydantic>=2.5.0",
  "rich>=14.0.0",
  "hydra-core>=1.3.2",
  "tqdm>=4.67.1",
  "python-statemachine>=3.2.1",
  "blinker>=1.9.0",
  "whatthepatch>=1.0.7",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "typer>=0.12",
  "redis>=8.1.0",
]

[project.scripts]
cadence = "cadence.commands:main"

[project.optional-dependencies]
test = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pytest-mock>=3.10.0",
  "pytest-xdist>=3.3.0",
]

dev = [
  "isort>=6.0.1",
  "flake8>=7.3.0",
  "mypy>=1.5.0",
  "types-PyYAML>=6.0.12",
  "import-linter>=2.0",
  "pre-commit>=4.2.0",
]

docs = [
  "sphinx>=7.1.0",
  "sphinx-rtd-theme>=2.0.0",
  "myst-parser>=2.0.0",
  "sphinx-autodoc-typehints>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence", "src"]



[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "llm: marks tests as requiring LLM API access",
]

# Logging configuration for tests
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Coverage configuration
[tool.coverage.run]
source = ["cadence", "src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# PyRight configuration
# Read by pyright and by basedpyright, which editors tend to supply. Without
# an explicit mode basedpyright applies its own "recommended" set -- reportAny,
# reportUnknownMemberType, reportUnusedCallResult -- which buries the findings
# worth acting on under a few thousand that are not.
[tool.pyright]
include = ["cadence", "tests"]
exclude = ["**/__pycache__"]
typeCheckingMode = "standard"
# So the editor and the CLI resolve the same interpreter.
venvPath = "."
venv = ".venv"
defineConstant = { DEBUG = true }
stubPath = "typings"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"
pythonPlatform = "All"
executionEnvironments = [{ root = "tests", pythonVersion = "3.11" }]

[tool.mypy]
files = ["cadence"]
python_version = "3.11"

# whatthepatch ships no stubs and has no types-* package. Silencing it by name
# rather than globally, so the next untyped dependency is a decision someone
# makes on purpose.
[[tool.mypy.overrides]]
module = ["whatthepatch.*"]
ignore_missing_imports = true

# The three planes, and the vocabulary underneath them. A layer may import
# what is below it and never what is above: this is the rule the package
# layout has always claimed, and until now nothing checked it.
[tool.importlinter]
root_package = "cadence"

[[tool.importlinter.contracts]]
name = "The planes are layered"
type = "layers"
layers = [
  "cadence.commands",
  "cadence.delivery",
  "cadence.control",
  "cadence.execution",
  "cadence.parsing",
  "cadence.observe",
  "cadence.core",
  "cadence.lifecycle",
  "cadence.errors",
]

# Ruff is the only formatter; see .pre-commit-config.yaml
[tool.ruff]
line-length = 88
target-version = "py311"
# The replaced loop -- src/ and the Hydra scripts that drive it. All of it
# goes when src/ does, so linting it now is churn.
extend-exclude = [
    "src",
    "*.ipynb",
    "main.py",
    "analyze_results.py",
    "run_h1_experiment.py",
    "run_h2_experiment.py",
    "train_rl.py",
    "experiments",
    "ui",
    # Ruff formats python blocks inside markdown. The docs still describe the
    # replaced loop, so they get rewritten rather than reformatted.
    "*.md",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order, so isort has nothing left to do
    "B",        # bugbear: the real bugs in this list
    "C4",       # comprehensions
    "SIM",      # simplifications
    "UP",       # syntax this Python version made obsolete
    "PIE",      # small misfeatures
    "PT",       # pytest style
    "RUF",      # ruff's own
]
ignore = [
    # typer's documented idiom is a call in the default: Argument(), Option().
    "B008",
]

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["cadence", "src"]
skip_glob = ["*/migrations/*"]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-xdist>=3.8.0",
    "types-pyyaml>=6.0.12.20260815",
]
