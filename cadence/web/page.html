<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cadence</title>
<link rel="stylesheet" href="/vendor/diff2html.min.css">
<script src="/vendor/diff2html.min.js"></script>
<style>
  /* One material. The record is a raised plane of the same ground, never a
     foreign sheet laid on it. The ground is blue because the diff is the most
     important surface on the page and green additions vanish on a green one. */
  :root {
    --panel: #142a33;
    --panel-deep: #0e2028;
    --plane: #1b343d;
    --plane-head: #21404a;
    --rule: #2a4a55;
    --rule-bright: #3b6272;
    --ink: #dde6ea;
    --ink-soft: #a0b4bd;
    --ink-faint: #8ba1ab;

    --caution: #e8ab45;
    --limit: #f0776a;
    --good: #4cb782;

    --del: #43232a;
    --del-word: #6b3039;
    --ins: #1d4434;
    --ins-word: #2c6a4c;

    --trace-1: #2b9cb8;
    --trace-2: #8f6ae6;
    --trace-3: #cf5f8e;

    --row: 30px;
    --gutter: 20px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: var(--panel); color: var(--ink);
    font: 400 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .mono, code, pre, .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  ::selection { background: var(--caution); color: #241a05; }
  :focus-visible { outline: 2px solid var(--caution); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: var(--rule-bright) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--rule-bright); }
  *::-webkit-scrollbar-track { background: transparent; }

  .stencil {
    font-size: 11px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  /* Nothing here scrolls the window. Each pane owns its scroll, so the record
     you opened is never below the list you opened it from. */
  #shell { display: grid; grid-template-columns: 210px 1fr; height: 100vh; }
  #rail { background: var(--panel-deep); border-right: 1px solid var(--rule); padding: 18px 0; overflow-y: auto; }
  #rail .stencil { padding: 0 var(--gutter); margin-bottom: 10px; display: block; }
  .exp {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline;
    padding: 5px var(--gutter); cursor: pointer; color: var(--ink-soft);
    border-left: 2px solid transparent;
  }
  .exp:hover { color: var(--ink); background: #ffffff06; }
  .exp[aria-current="true"] { color: var(--ink); border-left-color: var(--caution); background: #ffffff09; }
  .exp b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp i { font-style: normal; font-size: 12px; color: var(--ink-faint); }
  .exp i.live { color: var(--caution); }

  #main { display: flex; flex-direction: column; height: 100vh; min-width: 0; overflow: hidden; }
  #head { padding: 14px var(--gutter) 0; flex: none; }
  #work { flex: 1; min-height: 0; display: grid; overflow: hidden; }

  a, .link { color: var(--ink-soft); cursor: pointer; text-decoration: none; text-underline-offset: 3px; }
  a:hover, .link:hover { color: var(--ink); text-decoration: underline; }
  h1 { font-size: 20px; font-weight: 500; margin: 6px 0 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

  .plan {
    border-top: 1px solid var(--rule-bright); border-bottom: 1px solid var(--rule);
    padding: 10px 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 0 26px;
  }
  .facts { display: flex; flex-wrap: wrap; gap: 0 22px; }
  .facts > div { display: flex; flex-direction: column; gap: 1px; }
  .facts span { font-size: 16px; color: var(--ink); }

  .mark { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .mark.nominal { color: var(--ink-faint); }
  .mark.caution { color: var(--caution); }
  .mark.limit   { color: var(--limit); }
  .lamp { animation: lamp 1.6s steps(1, end) infinite; }
  @keyframes lamp { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) { .lamp { animation: none } }

  /* The summary band: the run's answer, computed, above the rows. */
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: 10px; padding: 10px 0 2px; }
  .panel { background: var(--plane); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px 4px; }
  .panel figcaption { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; font-size: 12.5px; }
  .panel figcaption b { font-weight: 500; }
  .band { display: flex; flex-wrap: wrap; gap: 10px 34px; padding: 12px 0 2px; }
  .metric { min-width: 300px; }
  .mh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .mh b { font-weight: 500; font-size: 14px; }
  .dirn { color: var(--ink-faint); font-size: 12px; }
  .line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
  .line i { font-style: normal; color: var(--ink-faint); width: 52px; flex: none; font-size: 11.5px; }
  .line .num { font-size: 15px; font-weight: 500; }
  .line .num.sub2 { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
  .at, .ref { color: var(--ink-faint); }
  .sub2 { color: var(--ink-soft); }
  /* The sign is arithmetic and the judgment is a word; colour repeats the
     word, it never carries the meaning alone. */
  .good { color: var(--good); }
  .bad  { color: var(--limit); }
  .flat { color: var(--ink-faint); }
  .best { color: var(--good); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .cmp { font-size: 12.5px; }
  .cause { color: var(--ink-soft); font-size: 12.5px; margin: 6px 0 0; max-width: 92ch; }
  .cause b { font-weight: 500; color: var(--caution); }

  .pane { overflow: auto; min-width: 0; }
  .pane.left { border-right: 1px solid var(--rule); background: var(--plane); }

  /* Run tier: strip left, record right. */
  .sortie { grid-template-columns: minmax(420px, 500px) minmax(0, 1fr); }
  .stripwrap { min-height: 100%; }
  .strip { width: 100%; border-collapse: collapse; }
  .strip th {
    position: sticky; top: 0; z-index: 2;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; text-align: left;
    font-weight: 600; color: var(--ink-faint); background: var(--plane-head);
    padding: 7px 12px; border-bottom: 1px solid var(--rule);
  }
  .strip td { height: var(--row); padding: 0 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .strip tbody tr { cursor: pointer; }
  .strip tbody tr:hover td { background: #ffffff0a; }
  .strip tbody tr[aria-selected="true"] td { background: var(--caution); }
  .strip tbody tr[aria-selected="true"] td { color: #241a05; }
  .strip tbody tr[aria-selected="true"] .mark,
  .strip tbody tr[aria-selected="true"] .from { color: #241a05; }
  .strip .r { text-align: right; }
  .strip .from { color: var(--ink-faint); font-size: 12px; }
  .tracecell { border-left: 1px solid var(--rule); }
  .tracecell .stencil {
    position: sticky; top: 0; z-index: 2; display: block;
    background: var(--plane-head); color: var(--ink-faint);
    padding: 7px 10px; border-bottom: 1px solid var(--rule);
  }

  .record { padding: 0 var(--gutter) 40px; }
  .record > .head { position: sticky; top: 0; z-index: 3; background: var(--panel); padding: 14px 0 10px; }
  .plate { margin-top: 4px; }
  .swap { display: flex; gap: 12px; align-items: baseline; }
  .swap button {
    background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
  }
  .swap button[aria-pressed="true"] { color: var(--caution); }
  .swap button:hover { color: var(--ink); }

  /* Experiment tier */
  .survey { grid-template-columns: minmax(0, 1fr); }
  .survey .pane { padding: 0 var(--gutter) 30px; }
  figure { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-soft); }
  .legend i { width: 10px; height: 10px; border-radius: 50%; }
  .caption { color: var(--ink-faint); font-size: 12px; margin: 6px 0 0; max-width: 90ch; }
  .runs { margin-top: 16px; background: var(--plane); border: 1px solid var(--rule); }

  .tip {
    position: fixed; pointer-events: none; z-index: 30; opacity: 0;
    background: var(--panel-raised); border: 1px solid var(--rule-bright);
    padding: 7px 10px; font-size: 12px; color: var(--ink); max-width: 260px;
    transition: opacity .1s linear;
  }
  .tip b { font-weight: 500; display: block; }
  .tip em { font-style: normal; color: var(--ink-faint); }

  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); list-style: none; }
  summary:hover { color: var(--ink); }
  summary::-webkit-details-marker { display: none }
  summary::before { content: "+ "; }
  details[open] summary::before { content: "− "; }
  pre.src {
    background: var(--plane); color: var(--ink); border: 1px solid var(--rule);
    margin: 10px 0 0; padding: 12px; overflow-x: auto; font-size: 12.5px; white-space: pre;
  }

  /* The diff is the same plane as everything else. Both of diff2html's
     variable families point here, and the surfaces it leaves transparent are
     given one, or the page shows through behind the code. */
  .d2h-wrapper {
    --d2h-bg-color: var(--plane);             --d2h-dark-bg-color: var(--plane);
    --d2h-color: var(--ink);                  --d2h-dark-color: var(--ink);
    --d2h-border-color: var(--rule);          --d2h-dark-border-color: var(--rule);
    --d2h-line-border-color: var(--rule);     --d2h-dark-line-border-color: var(--rule);
    --d2h-dim-color: var(--ink-faint);        --d2h-dark-dim-color: var(--ink-faint);
    --d2h-del-bg-color: var(--del);           --d2h-dark-del-bg-color: var(--del);
    --d2h-ins-bg-color: var(--ins);           --d2h-dark-ins-bg-color: var(--ins);
    --d2h-del-highlight-bg-color: var(--del-word);
    --d2h-dark-del-highlight-bg-color: var(--del-word);
    --d2h-ins-highlight-bg-color: var(--ins-word);
    --d2h-dark-ins-highlight-bg-color: var(--ins-word);
    --d2h-empty-placeholder-bg-color: var(--panel);
    --d2h-dark-empty-placeholder-bg-color: var(--panel);
    --d2h-empty-placeholder-border-color: var(--rule);
    --d2h-dark-empty-placeholder-border-color: var(--rule);
    --d2h-info-bg-color: var(--plane-head);   --d2h-dark-info-bg-color: var(--plane-head);
    --d2h-info-border-color: var(--rule);     --d2h-dark-info-border-color: var(--rule);
    --d2h-file-header-bg-color: var(--plane-head);
    --d2h-dark-file-header-bg-color: var(--plane-head);
    --d2h-ins-border-color: transparent;      --d2h-dark-ins-border-color: transparent;
    --d2h-del-border-color: transparent;      --d2h-dark-del-border-color: transparent;
  }
  .d2h-file-header { display: none; }
  .d2h-file-wrapper, .d2h-files-diff, .d2h-file-side-diff,
  .d2h-file-diff, .d2h-diff-table, .d2h-diff-tbody {
    background: var(--plane); color: var(--ink);
  }
  .d2h-code-linenumber, .d2h-code-side-linenumber {
    background: var(--plane-head); color: var(--ink-faint);
  }
  .d2h-code-wrapper { position: relative; }
  .d2h-file-wrapper { border: 1px solid var(--rule) !important; border-radius: 0 !important; margin: 0 !important; }
  .d2h-code-side-line, .d2h-code-line { font-size: 12.5px; }

  .empty { color: var(--ink-faint); padding: 18px 0; max-width: 62ch; }
  .empty b { color: var(--ink); font-weight: 500; display: block; margin-bottom: 4px; }

  @media (max-width: 1000px) {
    body { overflow: auto; height: auto; }
    #shell { grid-template-columns: 1fr; height: auto; }
    #main { height: auto; overflow: visible; }
    #work { overflow: visible; }
    .sortie, .survey { grid-template-columns: minmax(0, 1fr); }
    .pane { overflow: visible; }
    .pane.left { border-right: 0; border-bottom: 1px solid var(--rule); }
    #rail { border-right: 0; border-bottom: 1px solid var(--rule); padding: 8px 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
    #rail .stencil { margin: 0; flex: none; }
    #exps { display: flex; }
    .exp { display: flex; gap: 8px; border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; padding: 4px 12px; }
    .exp b { overflow: visible; }
    .exp[aria-current="true"] { border-left-color: transparent; border-bottom-color: var(--caution); }
  }
</style>
</head>
<body>
<div id="shell">
  <nav id="rail"><b class="stencil">Experiments</b><div id="exps"></div></nav>
  <main id="main">
    <div id="head"></div>
    <div id="work" class="survey"><div class="pane"><div class="empty">Reading the record…</div></div></div>
  </main>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
let at = { experiment: null, run: null, trial: null };
let metric = null, moving = false, timer = null, stamp = null;
let how = "split";
try { how = localStorage.getItem("cadence.diff") || "split"; } catch (e) {}

const ROW = 30;
const SERIES = ["#2b9cb8", "#8f6ae6", "#cf5f8e"];

function readHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const m = raw.match(/^run\/(.+?)(?:\/trial\/(.+))?$/);
  if (m) return { experiment: at.experiment, run: m[1], trial: m[2] || null };
  const e = raw.match(/^experiment\/(.+)$/);
  if (e) return { experiment: e[1], run: null, trial: null };
  return { experiment: null, run: null, trial: null };
}
function writeHash() {
  const h = at.run
    ? "#/run/" + encodeURIComponent(at.run) + (at.trial ? "/trial/" + encodeURIComponent(at.trial) : "")
    : at.experiment ? "#/experiment/" + encodeURIComponent(at.experiment) : "";
  if ((location.hash || "") !== h) history.replaceState(null, "", h || location.pathname);
}

const get = async (p) => {
  const r = await fetch(p);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LIMIT = ["failed", "crashed", "timed_out", "rejected"];
const CAUTION = ["stalled", "abandoned", "retried", "running", "started", "prompted"];
const band = (s) => LIMIT.includes(s) ? "limit" : CAUTION.includes(s) ? "caution" : "nominal";
const mark = (s, live) => `<span class="mark ${band(s)}${live ? " lamp" : ""}">${esc(String(s).replace(/_/g, " "))}</span>`;

const when = (iso) => {
  if (!iso) return "–";
  const d = new Date(iso), m = (Date.now() - d) / 60000;
  if (m < 1) return "just now";
  if (m < 60) return Math.round(m) + " min ago";
  if (m < 1440) return Math.round(m / 60) + " h ago";
  return d.toLocaleDateString();
};
const dur = (ms) => {
  if (ms == null) return "–";
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + " s";
  if (s < 3600) return Math.floor(s / 60) + " m " + String(Math.round(s % 60)).padStart(2, "0") + " s";
  return (s / 3600).toFixed(1) + " h";
};
const stampOf = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};
const money = (u) => u == null ? "unpriced" : "$" + Number(u).toFixed(4);

// A run stopped by a 429 says nothing about the search. Reading a red mark
// as a bad result is the mistake this sentence exists to prevent.
const ENVIRONMENT = /\b(429|503|quota|rate.?limit|unavailable|timed? out|connection|network)\b/i;
function cause(run) {
  if (!run.reason) return null;
  const raw = String(run.reason);
  const outside = ENVIRONMENT.test(raw);
  // The stored reason is truncated, so a provider's JSON arrives with its
  // last string unterminated. Read to the closing quote or to the end,
  // whichever comes first; requiring the quote finds nothing.
  let one = raw.split("\n")[0];
  const at = raw.indexOf('"message"');
  if (at !== -1) {
    const opens = raw.indexOf('"', raw.indexOf(":", at) + 1);
    if (opens !== -1) {
      let shut = raw.indexOf('"', opens + 1);
      if (shut === -1) shut = raw.length;
      one = raw.slice(0, raw.indexOf(":")) + " \u2014 " +
        raw.slice(opens + 1, shut).replace(/\\n/g, " ").replace(/\s+/g, " ").trim();
    }
  }
  if (one.length > 190) one = one.slice(0, 190).trimEnd() + "\u2026";
  return { outside, text: one,
    lead: outside ? "The environment interrupted it" : "The search ended" };
}


// Everything below is arithmetic the page does so the reader does not.
// Direction comes from the manifest and is never assumed.
let DIR = {}, BASE = null;
const better = (a, b, k) => DIR[k] === "minimize" ? a < b : a > b;

// The sign is arithmetic; the judgment is a word. They are separate fields
// and do not have to agree: on a maximize metric a positive delta is better,
// and an arrow carrying goodness would render a down-arrow beside +0.40.
function delta(now, was, k) {
  if (typeof now !== "number" || typeof was !== "number") return null;
  const d = now - was;
  if (d === 0) return { text: "no change", word: "same", cls: "flat" };
  const good = better(now, was, k);
  return {
    text: (d > 0 ? "+" : "\u2212") + Math.abs(d).toFixed(4).replace(/0+$/, "").replace(/\.$/, ""),
    word: good ? "better" : "worse",
    cls: good ? "good" : "bad",
    pct: was === 0 ? null : Math.abs(d / was) * 100,
  };
}

// Strictly better, so a tie is never stamped as a record.
function records(rows, k) {
  let best = null, at = null, count = 0, since = 0;
  rows.forEach(t => {
    const v = (t.metrics || {})[k];
    if (typeof v !== "number") return;
    if (best === null || better(v, best, k)) { best = v; at = t.seq; count++; since = 0; }
    else since++;
  });
  return { best, at, count, since };
}
const latestOf = (rows, k) => {
  for (let i = rows.length - 1; i >= 0; i--) {
    const v = (rows[i].metrics || {})[k];
    if (typeof v === "number") return { v, seq: rows[i].seq };
  }
  return null;
};
// The parent is not the row above: trials form a tree. Map a candidate
// fingerprint to what it scored, so a row can be compared with what it was
// actually patched from.
function byFingerprint(rows) {
  const m = {};
  rows.forEach(t => { if (t.candidate) m[t.candidate] = t; });
  return m;
}
const arrow = (k) => DIR[k] === "minimize" ? "\u2193" : DIR[k] === "maximize" ? "\u2191" : "";
const aim = (k) => DIR[k] === "minimize" ? "lower is better"
  : DIR[k] === "maximize" ? "higher is better" : "no direction declared";
const sig = (v) => typeof v === "number"
  ? (Math.abs(v) >= 1000 ? v.toLocaleString() : String(Number(v.toFixed(4)))) : esc(v);

const facts = (pairs, cls) => `<div class="facts ${cls || ""}">${
  pairs.filter(p => p && p[0] !== null && p[0] !== undefined)
       .map(([v, k]) => `<div><b class="stencil">${k}</b><span>${v}</span></div>`).join("")}</div>`;

const keysOf = (rows) => {
  const seen = [];
  for (const t of rows) for (const k of Object.keys(t.metrics || {})) if (!seen.includes(k)) seen.push(k);
  return seen;
};
const pick = (rows) => { const k = keysOf(rows); return k.includes(metric) ? metric : k[0] || null; };

// One crashed trial scores 0 while the rest sit near 2.6; taken literally that
// flattens a whole run into a hairline. The panel's answer is a working band
// with the excursion drawn leaving it, never a rescale that hides the zero.
function scaleOf(values) {
  const known = values.filter(v => typeof v === "number").sort((a, b) => a - b);
  if (!known.length) return null;
  const hi = known[known.length - 1];
  const floor = known[Math.floor(known.length * 0.1)];
  const lo = floor < hi ? floor : known[0];
  return { lo, hi, span: (hi - lo) || Math.abs(hi) || 1, offscale: known.filter(v => v < lo) };
}

const tip = $("tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = "1";
  const b = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + b.width > innerWidth - 8) x = e.clientX - b.width - 14;
  if (y + b.height > innerHeight - 8) y = e.clientY - b.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = "0"; };

function traceSvg(rows, key) {
  const vals = rows.map(t => (t.metrics || {})[key]);
  const s = scaleOf(vals);
  if (!s) return "";
  const W = 132, PAD = 18, H = rows.length * ROW;
  const x = (v) => PAD + Math.max(0, Math.min(1, (v - s.lo) / s.span)) * (W - PAD * 2);
  const y = (i) => i * ROW + ROW / 2;
  let d = "", pts = "";
  rows.forEach((t, i) => {
    const v = vals[i];
    if (typeof v !== "number") return;
    const off = v < s.lo, best = v === s.hi;
    d += (d ? " L " : "M ") + x(v).toFixed(1) + " " + y(i).toFixed(1);
    pts += `<circle cx="${x(v).toFixed(1)}" cy="${y(i).toFixed(1)}" r="${best ? 5 : 3.5}"
      fill="${off ? "var(--plane)" : best ? "var(--caution)" : "var(--trace-1)"}"
      stroke="${off ? "var(--limit)" : "var(--plane)"}" stroke-width="2"
      class="pt" data-i="${i}"><title>trial ${t.seq}: ${sig(v)}${off ? " (off scale low)" : ""}</title></circle>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block"
      role="img" aria-label="${esc(key)} by trial">
    <line x1="${PAD}" y1="0" x2="${PAD}" y2="${H}" stroke="var(--rule)"/>
    <path d="${d}" fill="none" stroke="var(--trace-1)" stroke-width="2" stroke-linejoin="round"/>
    ${pts}</svg>`;
}

function trajectorySvg(runs, key, H) {
  const s = scaleOf(runs.flatMap(r => r.points));
  let maxN = 0;
  runs.forEach(r => r.points.forEach((v, i) => { if (typeof v === "number") maxN = Math.max(maxN, i + 1); }));
  if (!s || !maxN) return "";
  const W = 1000, L = 64, R = 150, T = 18, B = 34;
  const x = (i) => L + (maxN === 1 ? (W - L - R) / 2 : (i / (maxN - 1)) * (W - L - R));
  const y = (v) => T + (1 - Math.max(0, Math.min(1, (v - s.lo) / s.span))) * (H - T - B);
  let body = "";
  runs.forEach((r, n) => {
    const c = SERIES[n % SERIES.length];
    let d = "", last = null;
    r.points.forEach((v, i) => {
      if (typeof v !== "number") return;
      const off = v < s.lo;
      d += (d ? " L " : "M ") + x(i).toFixed(1) + " " + y(v).toFixed(1);
      last = { i, v };
      body += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5"
        fill="${off ? "var(--panel)" : c}" stroke="${off ? "var(--limit)" : "var(--panel)"}" stroke-width="2"
        class="jp" data-run="${esc(r.id)}" data-seq="${i}" data-val="${sig(v)}" data-off="${off}"
        ><title>${esc(r.id)} trial ${i}: ${sig(v)}</title></circle>`;
    });
    body = `<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>` + body;
    if (last) body += `<text x="${(x(last.i) + 12).toFixed(1)}" y="${(y(last.v) + 4).toFixed(1)}"
      fill="${c}" font-size="12">${esc(r.label)}</text>`;
  });
  const grid = [s.hi, s.lo].map(v =>
    `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}" stroke="var(--rule)"/>
     <text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)" font-size="12">${sig(v)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
      aria-label="${esc(key)} by trial for ${runs.length} runs">
    ${grid}
    <text x="${L}" y="${H - 10}" fill="var(--ink-faint)" font-size="12">trial 0</text>
    <text x="${(W - R).toFixed(1)}" y="${H - 10}" text-anchor="end" fill="var(--ink-faint)" font-size="12">trial ${maxN - 1}</text>
    ${body}</svg>`;
}

// One chart per metric, the baseline drawn as the line to beat and the best
// point marked, so the shape of the search reads without touching the table.
function panels(trials) {
  const keys = keysOf(trials);
  if (!keys.length) return "";
  return `<div class="panels">${keys.map(k => {
    const r = records(trials, k);
    if (r.best === null) return "";
    const base = BASE ? BASE[k] : null;
    const vals = trials.map(t => (t.metrics || {})[k]);
    const known = vals.filter(v => typeof v === "number");
    const all = base == null ? known : known.concat([base]);
    const lo = Math.min(...all), hi = Math.max(...all), span = (hi - lo) || Math.abs(hi) || 1;
    const W = 520, H = 132, L = 46, R = 12, T = 12, B = 22;
    const x = (i) => L + (trials.length < 2 ? 0 : i / (trials.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / span) * (H - T - B);
    let d = "", dots = "";
    trials.forEach((t, i) => {
      const v = vals[i];
      if (typeof v !== "number") return;
      d += (d ? " L " : "M ") + x(i).toFixed(1) + " " + y(v).toFixed(1);
      const isBest = v === r.best;
      dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${isBest ? 4.5 : 2.4}"
        fill="${isBest ? "var(--good)" : "var(--trace-1)"}" stroke="var(--panel)" stroke-width="1.5"
        class="jp" data-run="trial ${t.seq}" data-seq="${t.seq}" data-val="${sig(v)}" data-off="false"/>`;
    });
    const baseline = base == null ? "" : `
      <line x1="${L}" y1="${y(base).toFixed(1)}" x2="${W - R}" y2="${y(base).toFixed(1)}"
        stroke="var(--caution)" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="${W - R}" y="${(y(base) - 5).toFixed(1)}" text-anchor="end" fill="var(--caution)"
        font-size="10.5">baseline ${sig(base)}</text>`;
    return `<figure class="panel">
      <figcaption><b>${esc(k)}</b> <span class="dirn">${arrow(k)} ${aim(k)}</span></figcaption>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        <line x1="${L}" y1="${y(hi).toFixed(1)}" x2="${W - R}" y2="${y(hi).toFixed(1)}" stroke="var(--rule)"/>
        <line x1="${L}" y1="${y(lo).toFixed(1)}" x2="${W - R}" y2="${y(lo).toFixed(1)}" stroke="var(--rule)"/>
        <text x="${L - 6}" y="${(y(hi) + 4).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)" font-size="10.5">${sig(hi)}</text>
        <text x="${L - 6}" y="${(y(lo) + 4).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)" font-size="10.5">${sig(lo)}</text>
        ${baseline}
        <path d="${d}" fill="none" stroke="var(--trace-1)" stroke-width="1.75" stroke-linejoin="round"/>
        ${dots}
        <text x="${L}" y="${H - 5}" fill="var(--ink-faint)" font-size="10.5">trial 0</text>
        <text x="${(W - R).toFixed(1)}" y="${H - 5}" text-anchor="end" fill="var(--ink-faint)" font-size="10.5">trial ${trials[trials.length - 1].seq}</text>
      </svg></figure>`;
  }).join("")}</div>`;
}

// Shneiderman's overview, adjoining the detail rather than on its own screen.
// Every number here is computed; the reader supplies nothing.
function summary(run, trials) {
  const keys = keysOf(trials);
  if (!keys.length) return "";
  return `<div class="band">${keys.map(k => {
    const r = records(trials, k), last = latestOf(trials, k);
    if (r.best === null) return "";
    const base = BASE ? BASE[k] : null;
    const vsBase = delta(r.best, base, k);
    const off = last && last.v !== r.best ? delta(last.v, r.best, k) : null;
    return `<div class="metric">
      <div class="mh"><b>${esc(k)}</b> <span class="dirn">${arrow(k)} ${aim(k)}</span></div>
      <div class="line"><i>best</i>
        <b class="num">${sig(r.best)}</b>
        <span class="at">at trial ${r.at}</span>
        ${vsBase ? `<span class="${vsBase.cls}">${vsBase.text}${
            vsBase.pct != null ? ` (${vsBase.pct.toFixed(1)}%)` : ""} ${vsBase.word}</span>
          <span class="ref">vs baseline ${sig(base)}</span>`
          : `<span class="ref">no baseline recorded</span>`}</div>
      ${last && last.v !== r.best ? `<div class="line"><i>latest</i>
        <b class="num sub2">${sig(last.v)}</b>
        <span class="at">at trial ${last.seq}</span>
        ${off ? `<span class="${off.cls}">${off.text} ${off.word} than best</span>` : ""}</div>` : ""}
      <div class="line"><i>records</i>
        <span class="sub2">${r.count} new best${r.count === 1 ? "" : "s"} in ${
          trials.filter(t => (t.metrics || {})[k] != null).length} scored</span>
        <span class="${r.since > 3 ? "bad" : "sub2"}">${r.since} scored trial${
          r.since === 1 ? "" : "s"} since the last new best</span></div>
    </div>`;
  }).join("")}</div>`;
}

// --- views ---------------------------------------------------------------
async function drawExperiments() {
  const rows = await get("/api/experiments");
  $("exps").innerHTML =
    `<div class="exp" data-x="" aria-current="${at.experiment === null && !at.run}"><b>All runs</b></div>` +
    rows.map(e => `<div class="exp" data-x="${esc(e.name)}" aria-current="${at.experiment === e.name}">
      <b title="${esc(e.name)}">${esc(e.name)}</b>
      <i class="${e.running ? "live" : ""}">${e.running ? e.running + " live" : e.runs}</i></div>`).join("");
  $("exps").querySelectorAll(".exp").forEach(el => el.onclick = () => {
    at = { experiment: el.dataset.x || null, run: null, trial: null }; metric = null; draw();
  });
}

const runTable = (runs) => `<div class="runs"><table class="strip"><thead><tr>
  <th>run</th><th>status</th><th class="r">trials</th><th>experiment</th>
  <th>owner</th><th>started</th></tr></thead><tbody>${
  runs.map(r => `<tr data-id="${esc(r.id)}">
    <td class="mono">${esc(r.id)}</td>
    <td>${mark(r.stalled ? "stalled" : r.status, r.status === "running" && !r.stalled)}</td>
    <td class="r num">${r.trials}</td>
    <td>${esc(r.experiment || "—")}</td>
    <td class="from">${esc(r.owner || "—")}</td>
    <td class="from">${when(r.started_at)}</td></tr>`).join("")}</tbody></table></div>`;

async function drawRuns() {
  const q = at.experiment ? "?experiment=" + encodeURIComponent(at.experiment) : "";
  const runs = await get("/api/runs" + q);
  moving = runs.some(r => r.status === "running" && !r.stalled);
  $("head").innerHTML = `<b class="stencil">${at.experiment ? "Experiment" : "All records"}</b>
    <h1>${esc(at.experiment || "All runs")}</h1>`;
  $("work").className = "survey";
  if (!runs.length) {
    $("work").innerHTML = `<div class="pane"><div class="empty"><b>No runs recorded.</b>
      A run records itself when DATABASE_URL is set. Start one with <code>cadence run</code>.</div></div>`;
    return;
  }
  $("work").innerHTML = `<div class="pane"><div id="chart"></div>${runTable(runs)}</div>`;
  $("work").querySelectorAll("tr[data-id]").forEach(tr =>
    tr.onclick = () => { at.run = tr.dataset.id; at.trial = null; metric = null; draw(); });
  if (at.experiment && runs.length > 1) await drawTrajectory(runs);
}

async function drawTrajectory(runs) {
  const shown = runs.slice(0, SERIES.length);
  const dropped = runs.length - shown.length;
  const fetched = await Promise.all(shown.map(r =>
    get("/api/runs/" + encodeURIComponent(r.id) + "/trials?limit=500").catch(() => [])));
  const keys = keysOf(fetched.flat());
  const key = keys.includes(metric) ? metric : keys[0];
  if (!key) return;
  const series = shown.map((r, i) => ({
    // Runs of one experiment are often started on the same day, so the date
    // alone labels two lines identically.
    id: r.id, label: stampOf(r.started_at), points: fetched[i].map(t => (t.metrics || {})[key])
  })).filter(s => s.points.some(v => typeof v === "number"));
  if (series.length < 2) return;
  const s = scaleOf(series.flatMap(r => r.points));
  const svg = trajectorySvg(series, key, 300);
  if (!svg) return;
  $("chart").innerHTML = `<figure>
    <figcaption class="swap" style="margin:4px 0 8px">
      <b class="stencil">${esc(key)} by trial</b>
      ${keys.length > 1 ? keys.map(k => `<button data-k="${esc(k)}" aria-pressed="${k === key}">${esc(k)}</button>`).join("") : ""}
    </figcaption>
    ${svg}
    <div class="legend">${series.map((s2, n) =>
      `<span><i style="background:${SERIES[n % SERIES.length]}"></i>${esc(s2.id)}</span>`).join("")}</div>
    <p class="caption">Straight between measurements, nothing smoothed; a gap is a trial that produced nothing.${
      s.offscale.length ? ` ${s.offscale.length} point${s.offscale.length > 1 ? "s" : ""} scored below the working band
      (${s.offscale.map(sig).join(", ")}) and sit hollow on the floor line.` : ""}${
      dropped ? ` ${dropped} older run${dropped > 1 ? "s are" : " is"} not plotted; ${dropped > 1 ? "they are" : "it is"} in the table below.` : ""}</p>
  </figure>`;
  $("chart").querySelectorAll("button[data-k]").forEach(b => b.onclick = () => { metric = b.dataset.k; draw(); });
  $("chart").querySelectorAll(".jp").forEach(c => {
    c.onmousemove = (e) => showTip(e, `<b>trial ${c.dataset.seq} · ${c.dataset.val}</b>
      <em>${esc(c.dataset.run)}${c.dataset.off === "true" ? " · off scale low" : ""}</em>`);
    c.onmouseleave = hideTip;
  });
}

async function drawRun() {
  const [run, trials] = await Promise.all([
    get("/api/runs/" + encodeURIComponent(at.run)),
    get("/api/runs/" + encodeURIComponent(at.run) + "/trials?limit=500"),
  ]);
  if (run.experiment) at.experiment = run.experiment;
  DIR = run.directions || {}; BASE = run.baseline || null;
  moving = run.status === "running" && !run.stalled;
  const state = run.stalled ? "stalled" : run.status;
  const key = pick(trials);
  const tokens = run.spend.tokens_in + run.spend.tokens_out;
  $("head").innerHTML = `
    <span class="link" id="back">← ${esc(run.experiment || "all runs")}</span>
    <div class="on-panel">
      <h1><span class="mono">${esc(run.id)}</span> ${mark(state, moving)}</h1>
      ${(() => { const c = cause(run); return c
        ? `<p class="cause"><b>${esc(c.lead)}</b> — ${esc(c.text)}</p>` : ""; })()}
      ${facts([
        [run.cap_trials ? `${run.trials} <span class="sub2">of ${run.cap_trials}</span>` : run.trials, "trials"],
        [run.scored, "scored"],
        [dur(run.duration_ms), "elapsed"],
        [run.spend.calls + (run.spend.replayed ? ` <em style="font-style:normal;color:var(--ink-faint)">(${run.spend.replayed} replayed)</em>` : ""), "model calls"],
        [tokens.toLocaleString(), "tokens"],
        run.spend.usd == null ? null : [money(run.spend.usd), "spent"],
      ], "plan")}
    </div>`;
  $("back").onclick = () => { at.run = null; at.trial = null; draw(); };
  $("head").insertAdjacentHTML("beforeend", summary(run, trials));
  $("head").insertAdjacentHTML("beforeend", panels(trials));
  const seen = byFingerprint(trials);
  const rec = records(trials, key);
  $("work").className = "sortie";
  $("work").innerHTML = `
    <div class="pane left" id="stripPane">${trials.length ? `<div class="stripwrap">
      <table class="strip"><thead><tr><th class="r">#</th><th>result</th>
        <th class="r">${esc(key || "metric")} ${arrow(key)}</th>
        <th>vs its parent</th></tr></thead><tbody>${
        trials.map(t => {
          const v = key && t.metrics ? t.metrics[key] : null;
          const from = t.parent ? seen[t.parent] : null;
          const was = from && from.metrics ? from.metrics[key] : (t.parent ? null : (BASE || {})[key]);
          const d = delta(v, was, key);
          const isBest = v != null && rec.best != null && v === rec.best;
          return `<tr data-id="${esc(t.id)}" aria-selected="${t.id === at.trial}">
          <td class="r num">${t.seq}</td>
          <td>${mark(t.outcome || t.status, false)}${isBest ? ' <span class="best">best</span>' : ""}</td>
          <td class="r num">${v != null ? sig(v) : "—"}</td>
          <td class="cmp">${d
            ? `<span class="${d.cls}">${d.text} ${d.word}</span>
               <span class="ref">than ${from ? "trial " + from.seq : "the baseline"}</span>`
            : `<span class="ref">${t.parent ? "parent not scored" : "no baseline"}</span>`}</td></tr>`;
        }).join("")}</tbody></table>
    </div>` : `<div class="empty" style="padding:22px"><b>No trials yet.</b>
      The run has started but nothing has been measured.</div>`}</div>
    <div class="pane" id="record"></div>`;
  $("work").querySelectorAll("tr[data-id]").forEach(tr =>
    tr.onclick = () => { at.trial = at.trial === tr.dataset.id ? null : tr.dataset.id; draw(); });
  $("work").querySelectorAll(".pt").forEach(c => {
    const t = trials[+c.dataset.i];
    c.onmousemove = (e) => showTip(e, `<b>trial ${t.seq} · ${sig((t.metrics || {})[key])}</b>
      <em>${esc(t.outcome || t.status)}</em>`);
    c.onmouseleave = hideTip;
    c.onclick = () => { at.trial = t.id; draw(); };
  });
  if (at.trial) await drawTrial(); else drawPlan(run);
}

// With nothing selected, the record pane carries what the run was told to do.
function drawPlan(run) {
  $("record").innerHTML = `<div class="record">
    <div class="head"><b class="stencil">Test plan</b></div>
    ${run.manifest ? `<pre class="src" style="margin-top:0">${esc(run.manifest)}</pre>`
      : `<div class="empty">No manifest was recorded for this run.</div>`}
    <p class="caption">Select a trial to read what the model changed.</p>
  </div>`;
}

async function drawTrial() {
  const t = await get("/api/trials/" + encodeURIComponent(at.trial));
  $("record").innerHTML = `<div class="record on-panel">
    <div class="head">
      <h1>Trial ${t.seq} ${mark(t.outcome || t.status, false)}
        ${t.diff ? `<span class="swap" style="margin-left:auto">
          <button data-how="split" aria-pressed="${how === "split"}">split</button>
          <button data-how="unified" aria-pressed="${how === "unified"}">unified</button></span>` : ""}</h1>
      ${facts([
        t.model ? [esc(t.model), "answered"] : null,
        t.latency_ms == null ? null : [dur(t.latency_ms), "waiting"],
        t.tokens_in == null ? null : [(t.tokens_in + t.tokens_out).toLocaleString(), "tokens"],
        t.cost_usd == null ? null : [money(t.cost_usd), "spent"],
        t.wall_ms == null ? null : [dur(t.wall_ms), "measuring"],
        t.attempts > 1 ? [t.attempts, "attempts"] : null,
        [t.parent ? `<span class="mono">${esc(t.parent.slice(0, 12))}</span>` : "seed", "folded from"],
      ], "plan")}
    </div>
    <div class="plate">${diffHtml(t)}</div>
    ${t.response ? `<details><summary>What the model said</summary><pre class="src">${esc(t.response)}</pre></details>` : ""}
    ${t.code ? `<details><summary>The whole program</summary><pre class="src">${esc(t.code)}</pre></details>` : ""}
  </div>`;
  $("record").querySelectorAll("button[data-how]").forEach(b => b.onclick = () => {
    how = b.dataset.how;
    try { localStorage.setItem("cadence.diff", how); } catch (e) {}
    drawTrial();
  });
}

function diffHtml(t) {
  if (t.diff === null || t.diff === undefined) {
    const why = t.response
      ? "The reply came back, but no patch could be made of it."
      : "No answer came back, so nothing was ever built.";
    return `<div class="empty"><b>No candidate.</b>${esc(t.reason || why)}</div>`;
  }
  if (!t.diff.trim()) return `<div class="empty"><b>Nothing changed.</b>The candidate is identical to its parent.</div>`;
  return Diff2Html.html(t.diff, {
    outputFormat: how === "split" ? "side-by-side" : "line-by-line",
    drawFileList: false, matching: "words", colorScheme: "dark",
  });
}

// --- the loop ------------------------------------------------------------
async function draw() {
  hideTip();
  writeHash();
  // A watched run redraws every few seconds; losing your place in the strip
  // each time would make the live view the one you cannot read.
  const keep = { left: $("stripPane")?.scrollTop, right: $("record")?.scrollTop };
  try {
    await drawExperiments();
    if (at.run) await drawRun(); else await drawRuns();
  } catch (e) {
    $("work").innerHTML = `<div class="pane"><div class="empty">
      <b>Could not read the record.</b>${esc(e.message)}</div></div>`;
  }
  if (keep.left) { const p = $("stripPane"); if (p) p.scrollTop = keep.left; }
  if (keep.right) { const p = $("record"); if (p) p.scrollTop = keep.right; }
  clearTimeout(timer);
  if (moving) timer = setTimeout(draw, 5000);
}

setInterval(async () => {
  try {
    const v = (await get("/api/version")).page;
    if (stamp === null) stamp = v; else if (v !== stamp) location.reload();
  } catch (e) {}
}, 1500);

at = readHash();
addEventListener("hashchange", () => { at = readHash(); draw(); });
draw();
</script>
