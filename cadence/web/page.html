<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cadence</title>
<link rel="stylesheet" href="/vendor/diff2html.min.css">
<script src="/vendor/diff2html.min.js"></script>
<style>
  :root {
    --panel: #171a1e;
    --panel-deep: #101317;
    --panel-raised: #1e2228;
    --rule: #2b3138;
    --rule-bright: #3a424b;
    --ink: #d3d8dc;
    --ink-soft: #949ca4;
    --ink-faint: #828a92;

    --stock: #dcd7ca;
    --stock-rule: #bdb6a4;
    --stock-ink: #1a1916;
    --stock-ink-soft: #57524a;

    --caution: #e0a13a;
    --limit: #e0685a;

    --trace-1: #2b9cb8;
    --trace-2: #8f6ae6;
    --trace-3: #cf5f8e;

    --row: 30px;
    --gutter: 22px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--panel);
    color: var(--ink);
    font: 400 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .mono, code, pre, .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  ::selection { background: var(--caution); color: #14171a; }
  :focus-visible { outline: 2px solid var(--caution); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: var(--rule-bright) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--rule-bright); border-radius: 0; }
  *::-webkit-scrollbar-track { background: transparent; }

  /* Stencil-cut label: the panel's own lettering. Uppercase, wide, small. */
  .stencil {
    font-size: 11px; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  #shell { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }

  #rail {
    background: var(--panel-deep);
    border-right: 1px solid var(--rule);
    padding: 20px 0; overflow-y: auto;
  }
  #rail .stencil { padding: 0 var(--gutter); margin-bottom: 12px; display: block; }
  .exp {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline;
    padding: 6px var(--gutter); cursor: pointer; color: var(--ink-soft);
    border-left: 2px solid transparent;
  }
  .exp:hover { color: var(--ink); background: #ffffff06; }
  .exp[aria-current="true"] { color: var(--ink); border-left-color: var(--caution); background: #ffffff09; }
  .exp b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp i { font-style: normal; font-size: 12px; color: var(--ink-faint); }
  .exp i.live { color: var(--caution); }

  #main { padding: 20px var(--gutter) 80px; overflow-x: hidden; min-width: 0; }
  @media (max-width: 760px) {
    #shell { grid-template-columns: 1fr; }
    #rail {
      border-right: 0; border-bottom: 1px solid var(--rule);
      padding: 10px 0; display: flex; align-items: center; gap: 4px; overflow-x: auto;
    }
    #rail .stencil { margin: 0; flex: none; }
    #exps { display: flex; }
    .exp {
      display: flex; gap: 8px;
      border-left: 0; border-bottom: 2px solid transparent;
      white-space: nowrap; padding: 4px 12px;
    }
    .exp b { overflow: visible; }
    .exp[aria-current="true"] { border-left-color: transparent; border-bottom-color: var(--caution); }
  }
  #crumbs { margin-bottom: 18px; }
  a, .link { color: var(--ink-soft); cursor: pointer; text-decoration: none; text-underline-offset: 3px; }
  a:hover, .link:hover { color: var(--ink); text-decoration: underline; }

  h1 {
    font-size: 19px; font-weight: 500; margin: 0;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }

  /* The plan band: what this run was told to do and what it has spent. */
  .plan {
    border-top: 1px solid var(--rule-bright);
    border-bottom: 1px solid var(--rule);
    padding: 12px 0; margin: 12px 0 0;
    display: flex; flex-wrap: wrap; gap: 0 28px;
  }
  .plan div { display: flex; flex-direction: column; gap: 2px; }
  .plan span { font-size: 16px; color: var(--ink); }
  .plan .reason { flex-basis: 100%; font-size: 13px; color: var(--caution); max-width: 90ch; }

  /* Dispositions are words, in a fixed column, in their own ink. Nominal is
     the absence of a stamp: no colour, no box, nothing to look at. */
  .mark { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .mark.nominal { color: var(--stock-ink-soft); }
  .mark.caution  { color: #7a5316; }
  .mark.limit    { color: #8f2f24; }
  .on-panel .mark.nominal { color: var(--ink-soft); }
  .on-panel .mark.caution { color: var(--caution); }
  .on-panel .mark.limit   { color: var(--limit); }
  .lamp { animation: lamp 1.6s steps(1, end) infinite; }
  @keyframes lamp { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) { .lamp { animation: none } }

  /* Card stock: the printed surface the record lives on. */
  .stock {
    background: var(--stock); color: var(--stock-ink);
    border: 1px solid #0b0d0f; box-shadow: 0 2px 10px #0006;
    overflow-x: auto; max-width: 100%;
  }
  .strip { width: 100%; border-collapse: collapse; }
  .strip th {
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase; text-align: left;
    font-weight: 600; color: var(--stock-ink-soft);
    padding: 8px 12px; border-bottom: 1px solid var(--stock-rule);
    background: #00000008;
  }
  .strip td {
    height: var(--row); padding: 0 12px;
    border-bottom: 1px solid #0000001a; white-space: nowrap;
  }
  .strip tbody tr { cursor: pointer; }
  .strip tbody tr:hover td { background: #00000010; }
  .strip tbody tr[aria-selected="true"] td { background: #0000001f; box-shadow: inset 2px 0 var(--limit); }
  .strip .r { text-align: right; }
  .strip .from { color: var(--stock-ink-soft); font-size: 12px; }
  .strip .why { color: var(--stock-ink-soft); font-size: 12px; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; }

  /* Run page: the strip, and the trace reading down beside it. */
  .sortie { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 18px; align-items: start; }
  .sortie > * { min-width: 0; }
  @media (max-width: 1100px) { .sortie { grid-template-columns: minmax(0, 1fr); } .trace-col { display: none } }
  .trace-col { position: sticky; top: 20px; }
  .trace-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }

  figure { margin: 0; }
  figcaption { margin-bottom: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-soft); }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .swap { display: flex; gap: 14px; align-items: baseline; }
  .swap button {
    background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
  }
  .swap button[aria-pressed="true"] { color: var(--caution); }
  .swap button:hover { color: var(--ink); }

  .tip {
    position: fixed; pointer-events: none; z-index: 20; opacity: 0;
    background: var(--panel-raised); border: 1px solid var(--rule-bright);
    padding: 7px 10px; font-size: 12px; color: var(--ink); max-width: 260px;
    transition: opacity .1s linear;
  }
  .tip b { font-weight: 500; display: block; }
  .tip em { font-style: normal; color: var(--ink-faint); }

  /* Trial record */
  #record { margin-top: 26px; }
  .facts { display: flex; flex-wrap: wrap; gap: 0 24px; margin: 0 0 14px; }
  .facts div { display: flex; flex-direction: column; gap: 1px; }
  .facts span { font-size: 15px; }
  .note { color: var(--ink-soft); max-width: 72ch; }
  details { margin-top: 14px; }
  summary {
    cursor: pointer; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint); list-style: none;
  }
  summary:hover { color: var(--ink); }
  summary::-webkit-details-marker { display: none }
  summary::before { content: "+ "; }
  details[open] summary::before { content: "− "; }
  pre.src {
    background: var(--stock); color: var(--stock-ink); border: 1px solid #0b0d0f;
    margin: 10px 0 0; padding: 14px; overflow-x: auto; font-size: 12.5px; white-space: pre;
  }
  .d2h-wrapper { margin-top: 10px; }
  .d2h-file-header { display: none; }
  .d2h-code-wrapper { position: relative; }
  .d2h-file-wrapper { border: 1px solid #0b0d0f !important; border-radius: 0 !important; }

  .empty { color: var(--ink-faint); padding: 18px 0; max-width: 62ch; }
  .empty b { color: var(--ink); font-weight: 500; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="shell">
  <nav id="rail"><b class="stencil">Experiments</b><div id="exps"></div></nav>
  <main id="main"><div id="crumbs"></div><div id="body" class="empty">Reading the record…</div></main>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
let at = { experiment: null, run: null, trial: null };
let metric = null;
let moving = false;
let timer = null;
let how = "split";
try { how = localStorage.getItem("cadence.diff") || "split"; } catch (e) {}

const ROW = 30;
const SERIES = ["#2b9cb8", "#8f6ae6", "#cf5f8e"];

// The address bar is the state. A run you are watching is a tab you can
// leave open, bookmark, or send to someone with the same database.
function readHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const m = raw.match(/^run\/(.+?)(?:\/trial\/(.+))?$/);
  if (m) return { experiment: at.experiment, run: m[1], trial: m[2] || null };
  const e = raw.match(/^experiment\/(.+)$/);
  if (e) return { experiment: e[1], run: null, trial: null };
  return { experiment: null, run: null, trial: null };
}
function writeHash() {
  const h = at.run
    ? "#/run/" + encodeURIComponent(at.run) + (at.trial ? "/trial/" + encodeURIComponent(at.trial) : "")
    : at.experiment ? "#/experiment/" + encodeURIComponent(at.experiment) : "";
  if ((location.hash || "") !== h) history.replaceState(null, "", h || location.pathname);
}

const get = async (p) => {
  const r = await fetch(p);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LIMIT = ["failed", "crashed", "timed_out", "rejected"];
const CAUTION = ["stalled", "abandoned", "retried", "running", "started", "prompted"];
const band = (s) => LIMIT.includes(s) ? "limit" : CAUTION.includes(s) ? "caution" : "nominal";
const mark = (s, live) =>
  `<span class="mark ${band(s)}${live ? " lamp" : ""}">${esc(String(s).replace(/_/g, " "))}</span>`;

const when = (iso) => {
  if (!iso) return "–";
  const d = new Date(iso), m = (Date.now() - d) / 60000;
  if (m < 1) return "just now";
  if (m < 60) return Math.round(m) + " min ago";
  if (m < 1440) return Math.round(m / 60) + " h ago";
  return d.toLocaleDateString();
};
const dur = (ms) => {
  if (ms == null) return "–";
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + " s";
  if (s < 3600) return Math.floor(s / 60) + " m " + String(Math.round(s % 60)).padStart(2, "0") + " s";
  return (s / 3600).toFixed(1) + " h";
};
const money = (u) => u == null ? "unpriced" : "$" + Number(u).toFixed(4);
const sig = (v) => typeof v === "number"
  ? (Math.abs(v) >= 1000 ? v.toLocaleString() : String(Number(v.toFixed(4))))
  : esc(v);

const facts = (pairs) => `<div class="facts">${
  pairs.filter(p => p && p[0] !== null && p[0] !== undefined)
       .map(([v, k]) => `<div><b class="stencil">${k}</b><span>${v}</span></div>`).join("")}</div>`;

const keysOf = (rows) => {
  const seen = [];
  for (const t of rows) for (const k of Object.keys(t.metrics || {})) if (!seen.includes(k)) seen.push(k);
  return seen;
};
const pick = (rows) => {
  const keys = keysOf(rows);
  return keys.includes(metric) ? metric : keys[0] || null;
};

// --- tooltip -------------------------------------------------------------
const tip = $("tip");
function showTip(e, html) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const b = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + b.width > innerWidth - 8) x = e.clientX - b.width - 14;
  if (y + b.height > innerHeight - 8) y = e.clientY - b.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = "0"; };

// --- the trace: metric down the page, in step with the strip -------------
function traceSvg(rows, key) {
  const vals = rows.map(t => (t.metrics || {})[key]);
  const known = vals.filter(v => typeof v === "number");
  if (known.length < 1) return `<p class="empty">Nothing scored yet.</p>`;
  const lo = Math.min(...known), hi = Math.max(...known);
  const span = hi - lo || Math.abs(hi) || 1;
  const W = 220, PAD = 26, H = rows.length * ROW;
  const x = (v) => PAD + ((v - lo) / span) * (W - PAD * 2);
  const y = (i) => i * ROW + ROW / 2;
  let d = "", pts = "";
  rows.forEach((t, i) => {
    const v = vals[i];
    if (typeof v !== "number") return;
    d += (d ? " L " : "M ") + x(v).toFixed(1) + " " + y(i).toFixed(1);
    const best = v === hi;
    pts += `<circle cx="${x(v).toFixed(1)}" cy="${y(i).toFixed(1)}" r="${best ? 5 : 4}"
      fill="${best ? "var(--caution)" : "var(--trace-1)"}" stroke="var(--panel)" stroke-width="2"
      data-i="${i}" class="pt"><title>trial ${t.seq}: ${sig(v)}</title></circle>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="${esc(key)} by trial, ${known.length} scored">
    <line x1="${PAD}" y1="0" x2="${PAD}" y2="${H}" stroke="var(--rule)" stroke-width="1"/>
    <path d="${d}" fill="none" stroke="var(--trace-1)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${pts}
  </svg>`;
}

// --- the trajectory: one line per run, across an experiment --------------
function trajectorySvg(runs, key) {
  const W = 760, H = 240, L = 54, R = 118, T = 16, B = 30;
  let lo = Infinity, hi = -Infinity, maxN = 0;
  for (const r of runs) {
    r.points.forEach((v, i) => {
      if (typeof v !== "number") return;
      lo = Math.min(lo, v); hi = Math.max(hi, v); maxN = Math.max(maxN, i + 1);
    });
  }
  if (!isFinite(lo) || maxN === 0) return "";
  const span = hi - lo || Math.abs(hi) || 1;
  const x = (i) => L + (maxN === 1 ? (W - L - R) / 2 : (i / (maxN - 1)) * (W - L - R));
  const y = (v) => T + (1 - (v - lo) / span) * (H - T - B);
  let body = "";
  runs.forEach((r, n) => {
    const c = SERIES[n % SERIES.length];
    let d = "", last = null;
    r.points.forEach((v, i) => {
      if (typeof v !== "number") return;
      d += (d ? " L " : "M ") + x(i).toFixed(1) + " " + y(v).toFixed(1);
      last = { i, v };
      body += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5" fill="${c}"
        stroke="var(--panel)" stroke-width="2" class="jp" data-run="${esc(r.id)}"
        data-seq="${i}" data-val="${sig(v)}"><title>${esc(r.id)} trial ${i}: ${sig(v)}</title></circle>`;
    });
    body = `<path d="${d}" fill="none" stroke="${c}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>` + body;
    if (last) body += `<text x="${(x(last.i) + 10).toFixed(1)}" y="${(y(last.v) + 4).toFixed(1)}"
      fill="var(--ink-soft)" font-size="11">${esc(r.id.slice(9, 15))}</text>`;
  });
  const ticks = [hi, lo].map(v =>
    `<text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" fill="var(--ink-faint)"
      font-size="11">${sig(v)}</text>
     <line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}"
      stroke="var(--rule)" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(key)} by trial for ${runs.length} runs">
    ${ticks}
    <text x="${L}" y="${H - 8}" fill="var(--ink-faint)" font-size="11">trial 0</text>
    <text x="${(W - R).toFixed(1)}" y="${H - 8}" text-anchor="end" fill="var(--ink-faint)"
      font-size="11">trial ${maxN - 1}</text>
    ${body}
  </svg>`;
}

// --- views ---------------------------------------------------------------
async function drawExperiments() {
  const rows = await get("/api/experiments");
  $("exps").innerHTML =
    `<div class="exp" data-x="" aria-current="${at.experiment === null}"><b>All runs</b></div>` +
    rows.map(e => `<div class="exp" data-x="${esc(e.name)}" aria-current="${at.experiment === e.name}">
      <b title="${esc(e.name)}">${esc(e.name)}</b>
      <i class="${e.running ? "live" : ""}">${e.running ? e.running + " live" : e.runs}</i></div>`).join("");
  $("exps").querySelectorAll(".exp").forEach(el => el.onclick = () => {
    at = { experiment: el.dataset.x || null, run: null, trial: null }; metric = null; draw();
  });
}

async function drawRuns() {
  const q = at.experiment ? "?experiment=" + encodeURIComponent(at.experiment) : "";
  const runs = await get("/api/runs" + q);
  moving = runs.some(r => r.status === "running" && !r.stalled);
  $("crumbs").innerHTML = `<b class="stencil">${at.experiment ? "Experiment" : "All records"}</b>`;
  if (!runs.length) {
    $("body").innerHTML = `<div class="empty"><b>No runs recorded.</b>
      A run records itself when DATABASE_URL is set. Start one with <code>cadence run</code>.</div>`;
    return;
  }
  $("body").innerHTML =
    `<h1>${esc(at.experiment || "All runs")}</h1>
     <div id="chart"></div>
     <div class="stock" style="margin-top:22px"><table class="strip"><thead><tr>
       <th>run</th><th>status</th><th class="r">trials</th><th>experiment</th>
       <th>owner</th><th>started</th></tr></thead><tbody>${
      runs.map(r => `<tr data-id="${esc(r.id)}">
        <td class="mono">${esc(r.id)}</td>
        <td>${mark(r.stalled ? "stalled" : r.status, r.status === "running" && !r.stalled)}</td>
        <td class="r num">${r.trials}</td>
        <td>${esc(r.experiment || "—")}</td>
        <td class="from">${esc(r.owner || "—")}</td>
        <td class="from">${when(r.started_at)}</td></tr>`).join("")}</tbody></table></div>`;
  $("body").querySelectorAll("tr[data-id]").forEach(tr =>
    tr.onclick = () => { at.run = tr.dataset.id; at.trial = null; metric = null; draw(); });
  if (at.experiment && runs.length > 1) await drawTrajectory(runs);
}

async function drawTrajectory(runs) {
  const some = runs.slice(0, SERIES.length);
  const fetched = await Promise.all(some.map(r =>
    get("/api/runs/" + encodeURIComponent(r.id) + "/trials?limit=500").catch(() => [])));
  const keys = keysOf(fetched.flat());
  const key = keys.includes(metric) ? metric : keys[0];
  if (!key) return;
  const series = some.map((r, i) => ({
    id: r.id, points: fetched[i].map(t => (t.metrics || {})[key])
  })).filter(s => s.points.some(v => typeof v === "number"));
  if (series.length < 2) return;
  const svg = trajectorySvg(series, key);
  if (!svg) return;
  $("chart").innerHTML = `<figure>
    <figcaption class="swap">
      <b class="stencil">${esc(key)} by trial</b>
      ${keys.length > 1 ? keys.map(k =>
        `<button data-k="${esc(k)}" aria-pressed="${k === key}">${esc(k)}</button>`).join("") : ""}
    </figcaption>
    ${svg}
    <div class="legend">${series.map((s, n) =>
      `<span><i style="background:${SERIES[n % SERIES.length]}"></i>${esc(s.id)}</span>`).join("")}</div>
    <p class="empty" style="padding:8px 0 0;font-size:12px">Points are the trials that scored; a gap is a
      trial that produced nothing. Lines are straight between measurements — nothing is smoothed.</p>
  </figure>`;
  $("chart").querySelectorAll("button[data-k]").forEach(b =>
    b.onclick = () => { metric = b.dataset.k; draw(); });
  $("chart").querySelectorAll(".jp").forEach(c => {
    c.onmousemove = (e) => showTip(e,
      `<b>trial ${c.dataset.seq} · ${c.dataset.val}</b><em>${esc(c.dataset.run)}</em>`);
    c.onmouseleave = hideTip;
  });
}

async function drawRun() {
  const [run, trials] = await Promise.all([
    get("/api/runs/" + encodeURIComponent(at.run)),
    get("/api/runs/" + encodeURIComponent(at.run) + "/trials?limit=500"),
  ]);
  moving = run.status === "running" && !run.stalled;
  const live = moving;
  const state = run.stalled ? "stalled" : run.status;
  const key = pick(trials);
  const tokens = run.spend.tokens_in + run.spend.tokens_out;
  $("crumbs").innerHTML = `<span class="link" id="back">← ${esc(run.experiment || "all runs")}</span>`;
  $("body").innerHTML = `
    <div class="on-panel">
      <h1><span class="mono">${esc(run.id)}</span> ${mark(state, live)}</h1>
      ${facts([
        [run.trials, "trials flown"],
        [run.scored, "scored"],
        [dur(run.duration_ms), "elapsed"],
        [run.spend.calls + (run.spend.replayed ? ` <em class="note">(${run.spend.replayed} replayed)</em>` : ""), "model calls"],
        [tokens.toLocaleString(), "tokens"],
        run.spend.usd == null ? null : [money(run.spend.usd), "spent"],
      ]).replace('class="facts"', 'class="facts plan"')}
      ${run.reason ? `<p class="plan reason" style="border:0;padding:8px 0 0">${esc(run.reason)}</p>` : ""}
    </div>
    <div class="sortie" style="margin-top:20px">
      <div class="stock">
        ${trials.length ? `<table class="strip"><thead><tr>
          <th class="r">#</th><th>disposition</th><th>${esc(key || "metrics")}</th>
          <th>from</th><th>note</th></tr></thead><tbody>${
          trials.map(t => `<tr data-id="${esc(t.id)}" aria-selected="${t.id === at.trial}">
            <td class="r num">${t.seq}</td>
            <td>${mark(t.outcome || t.status, false)}</td>
            <td class="num">${key && t.metrics && t.metrics[key] != null ? sig(t.metrics[key]) : "—"}</td>
            <td class="from mono">${t.parent ? esc(t.parent.slice(0, 8)) : "seed"}</td>
            <td class="why">${esc(t.reason || "")}</td></tr>`).join("")}</tbody></table>`
          : `<div class="empty" style="padding:22px"><b>No trials yet.</b>
             The run has started but nothing has been measured.</div>`}
      </div>
      <div class="trace-col">
        <div class="trace-head"><b class="stencil">${esc(key || "trace")}</b>
          <b class="stencil">${trials.length} pts</b></div>
        ${trials.length ? traceSvg(trials, key) : ""}
      </div>
    </div>
    <div id="record"></div>
    ${run.manifest ? `<details><summary>Test plan</summary><pre class="src">${esc(run.manifest)}</pre></details>` : ""}`;
  $("back").onclick = () => { at.run = null; at.trial = null; draw(); };
  $("body").querySelectorAll("tr[data-id]").forEach(tr =>
    tr.onclick = () => { at.trial = at.trial === tr.dataset.id ? null : tr.dataset.id; draw(); });
  $("body").querySelectorAll(".pt").forEach(c => {
    const t = trials[+c.dataset.i];
    c.onmousemove = (e) => showTip(e,
      `<b>trial ${t.seq} · ${sig((t.metrics || {})[key])}</b><em>${esc(t.outcome || t.status)}</em>`);
    c.onmouseleave = hideTip;
    c.onclick = () => { at.trial = t.id; draw(); };
  });
  if (at.trial) await drawTrial();
}

async function drawTrial() {
  const t = await get("/api/trials/" + encodeURIComponent(at.trial));
  $("record").innerHTML = `
    <div class="on-panel">
      <h1>Trial ${t.seq} ${mark(t.outcome || t.status, false)}
        ${t.diff ? `<span class="swap" style="font-size:11px">
          <button data-how="split" aria-pressed="${how === "split"}">split</button>
          <button data-how="unified" aria-pressed="${how === "unified"}">unified</button></span>` : ""}</h1>
      ${facts([
        t.model ? [esc(t.model), "answered"] : null,
        t.latency_ms == null ? null : [dur(t.latency_ms), "waiting"],
        t.tokens_in == null ? null : [(t.tokens_in + t.tokens_out).toLocaleString(), "tokens"],
        t.cost_usd == null ? null : [money(t.cost_usd), "spent"],
        t.wall_ms == null ? null : [dur(t.wall_ms), "measuring"],
        t.attempts > 1 ? [t.attempts, "attempts"] : null,
        [t.parent ? `<span class="mono">${esc(t.parent.slice(0, 12))}</span>` : "seed", "folded from"],
      ]).replace('class="facts"', 'class="facts plan"')}
    </div>
    ${diffHtml(t)}
    ${t.response ? `<details><summary>What the model said</summary><pre class="src">${esc(t.response)}</pre></details>` : ""}
    ${t.code ? `<details><summary>The whole program</summary><pre class="src">${esc(t.code)}</pre></details>` : ""}`;
  $("record").querySelectorAll("button[data-how]").forEach(b => b.onclick = () => {
    how = b.dataset.how;
    try { localStorage.setItem("cadence.diff", how); } catch (e) {}
    drawTrial();
  });
}

function diffHtml(t) {
  if (t.diff === null || t.diff === undefined) {
    const why = t.response
      ? "The reply came back, but no patch could be made of it."
      : "No answer came back, so nothing was ever built.";
    return `<div class="empty"><b>No candidate.</b>${esc(t.reason || why)}</div>`;
  }
  if (!t.diff.trim()) {
    return `<div class="empty"><b>Nothing changed.</b>
      The candidate is identical to its parent.</div>`;
  }
  return Diff2Html.html(t.diff, {
    outputFormat: how === "split" ? "side-by-side" : "line-by-line",
    drawFileList: false, matching: "words", colorScheme: "light",
  });
}

// --- the loop ------------------------------------------------------------
async function draw() {
  hideTip();
  writeHash();
  // The shell ships with an empty-state class on #body; it carries a reading
  // measure that would cap every later view at 62ch.
  $("body").className = "";
  try {
    await drawExperiments();
    if (at.run) await drawRun(); else await drawRuns();
  } catch (e) {
    $("body").innerHTML = `<div class="empty"><b>Could not read the record.</b>${esc(e.message)}</div>`;
  }
  clearTimeout(timer);
  if (moving) timer = setTimeout(draw, 5000);
}

// The page is read from disk on every request, so an edit is live the moment
// it is saved; this is the half that saves the reload.
let stamp = null;
setInterval(async () => {
  try {
    const v = (await get("/api/version")).page;
    if (stamp === null) stamp = v; else if (v !== stamp) location.reload();
  } catch (e) {}
}, 1500);

at = readHash();
addEventListener("hashchange", () => { at = readHash(); draw(); });
draw();
</script>
</body>
</html>
