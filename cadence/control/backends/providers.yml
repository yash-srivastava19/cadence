# Settings, never secrets. Override in providers.local.yml (gitignored) or
# per-run from .cadence:  model: {gemini: {model: gemini-3.6-pro}}
#
# API keys are read from the environment named by key_from and from nowhere
# else, so `op run -- cadence run`, direnv, sops or a plain export all work
# and none of them are cadence's business.
#
# Every provider speaks the OpenAI dialect, so adding one is a row.
#
# Prices are yours to declare, keyed by model, in USD per million tokens:
#
#   prices:
#     gpt-5.2: {in: 1.25, out: 10.0}
#
# Nothing is shipped for a paid provider. A price is a fact about someone
# else's catalogue on the day it was written, and a stale one silently
# misreports every run that used it -- the same reason no default model is
# shipped for a provider cadence has not called. Declare yours in
# providers.local.yml and a run reports what it cost; leave it out and a run
# reports tokens and says nothing about money.

defaults:
  timeout: 300
  attempts: 3
  backoff: 1.0
  temperature: 0.8

providers:
  ollama:
    base_url: http://localhost:11434/v1
    base_url_from: OLLAMA_HOST
    model: qwen3:4b
    # The one price that cannot rot: a model running on your own machine is
    # not billed by anybody. Declared for every model rather than by name,
    # which is what the * key means.
    prices:
      "*": {in: 0.0, out: 0.0}

  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_from: [GEMINI_API_KEY, GOOGLE_API_KEY]
    model: gemini-3.6-flash
    timeout: 120

  # No default model for these two: cadence has not called them, and shipping
  # a guess about someone else's catalogue is a claim that rots. Name one in
  # .cadence:  model: {openai: {model: ...}}
  openai:
    base_url: https://api.openai.com/v1
    key_from: [OPENAI_API_KEY]

  anthropic:
    base_url: https://api.anthropic.com/v1
    key_from: [ANTHROPIC_API_KEY]
