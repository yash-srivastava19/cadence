name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  code_standards:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cadence
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cadence -d cadence"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run pre-commit
        run: pre-commit run --all-files

      # Its own step so a docs failure reads as a docs failure.
      - name: Check the documentation against the code
        run: pytest tests/test_docs.py -q

      # Every test mocks its model calls, so a placeholder key is enough.
      - name: Create the roles and the test database
        env:
          PGPASSWORD: cadence
        run: |
          for script in ops/initdb/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -p 5433 -U cadence -d cadence -f "$script"
          done

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://cadence:cadence@localhost:5433/cadence_test
          TEST_DATABASE_APP_URL: postgresql://cadence_app:cadence_app@localhost:5433/cadence_test
        run: pytest tests/ -q
