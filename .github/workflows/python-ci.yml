name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  code_standards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run pre-commit
        run: pre-commit run --all-files

      # Its own step so a docs failure reads as a docs failure.
      - name: Check the documentation against the code
        run: pytest tests/test_docs.py -q

      # The same compose file and the same .env a developer uses.
      - name: Start the database
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Migrate the test database
        run: |
          set -a && . ./.env && set +a
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: Run tests
        run: |
          set -a && . ./.env && set +a
          pytest tests/ -q
