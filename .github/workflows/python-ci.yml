name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  code_standards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pre-commit
        run: |
          pre-commit run --all-files

      - name: Run tests
        env:
          GEMINI_API_KEY: not-a-real-key
        run: |
          pytest tests/ -q \
            --deselect tests/unit/test_llm.py::TestLLM::test_generate_success
