name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # The published site is built by Read the Docs on its own infrastructure, so a
  # broken mkdocs config never reached CI and the first sign of it was a failed
  # RTD build. This runs the same build, strictly, on every pull request.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The same group Read the Docs installs, from the same pyproject.
      - name: Install dependencies
        run: uv sync --group docs

      # --strict turns a broken link or a missing nav entry into a failure here
      # rather than a warning nobody reads.
      - name: Build the documentation
        run: uv run mkdocs build --clean --strict

  code_standards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The same installer and the same groups a developer runs through
      # `make install`: one environment definition, in the dependency groups.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      # Its own step so a type failure reads as a type failure. Configured in
      # pyproject; it checks cadence/ only, and it is clean.
      - name: Type-check
        run: uv run mypy

      # The planes are a layering claim. This is what makes it a rule.
      - name: Check the import layers
        run: uv run lint-imports

      # Its own step so a docs failure reads as a docs failure.
      - name: Check the documentation against the code
        run: uv run pytest tests/test_docs.py -q

      # The same compose file and the same .env a developer uses.
      - name: Start the database
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Migrate the test database
        run: |
          set -a && . ./.env && set +a
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head

      - name: Run tests
        env:
          # The port docker-compose maps redis to when .env does not say.
          REDIS_URL: redis://localhost:6380/0
        run: |
          set -a && . ./.env && set +a
          uv run pytest tests/ -q
