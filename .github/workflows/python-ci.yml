name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  code_standards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run pre-commit
        run: pre-commit run --all-files

      # Its own step so a docs failure reads as a docs failure.
      - name: Check the documentation against the code
        run: pytest tests/test_docs.py -q

      # Every test mocks its model calls, so a placeholder key is enough.
      - name: Run tests
        env:
          GEMINI_API_KEY: not-a-real-key
        run: pytest tests/ -q
