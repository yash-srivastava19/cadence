repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff a developer runs; a stale pin means CI and
    # the editor disagree about both rules and formatting.
    rev: v0.16.4
    hooks:
      - id: ruff-check
        types_or: [ python, pyi ]
        args: [ --fix ]

      - id: ruff-format
        types_or: [ python, pyi ]

  # The two checks CI runs that are not hooks upstream. On push rather than on
  # commit: they take seconds rather than milliseconds, and the point is to
  # find out before the PR does, not before every commit does.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [ python ]
        pass_filenames: false
        stages: [ pre-push ]

      - id: lint-imports
        name: the planes are layered
        entry: uv run lint-imports
        language: system
        types: [ python ]
        pass_filenames: false
        stages: [ pre-push ]
