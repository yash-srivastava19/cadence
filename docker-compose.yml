services:
  postgres:
    image: postgres:18-alpine
    container_name: cadence-postgres
    environment:
      POSTGRES_DB: cadence
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cadence-pgdata:/var/lib/postgresql
      - ./ops/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: cadence-redis
    # No persistence: a lock outliving the process that took it is a bug, not
    # a thing to restore after a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  cadence-pgdata:
